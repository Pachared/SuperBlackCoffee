services:
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    ports: ['5175:5175']
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://superblackcoffee.co.th}
    restart: unless-stopped
  pos:
    build: ./apps/pos
    ports: ['5173:5173']
    environment:
      VITE_API_URL: http://localhost:8080
    restart: unless-stopped
  admin:
    build: ./apps/admin
    ports: ['5174:5174']
    environment:
      VITE_API_URL: http://localhost:8080
    restart: unless-stopped
  franchise:
    build:
      context: .
      dockerfile: apps/franchise/Dockerfile
    ports: ['5176:5176']
    environment:
      VITE_API_URL: http://localhost:8080
    restart: unless-stopped
  api:
    build: ./apps/api
    ports: ['8080:8080']
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  redis:
    container_name: superblackcoffee-redis
    image: redis:7-alpine
    ports: ['6379:6379']
    command: redis-server --appendonly yes
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  database:
    container_name: superblackcoffee-postgresql
    image: postgres:17-alpine
    ports: ['5433:5432']
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: ['database_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  database_data:
  redis_data:
